<!doctype html>
<html lang="pt-BR" %sveltekit.body.attrs%>
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.png" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#282e35" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calper" />
  <title>Calper — Plataforma do Investidor</title>
  <style>
    html,
    body {
      touch-action: manipulation; /* evita o zoom no duplo-toque */
    }
  </style>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover" class="bg-white text-calper-dark">
  <div style="display: contents">%sveltekit.body%</div>
  <script>
    // Safari/iOS ignora "user-scalable=no" do viewport — isso bloqueia o
    // gesto de pinça (pinch-to-zoom) diretamente, que é o jeito que ainda funciona lá.
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
  </script>
</body>
</html>
